name: Bootstrap Blender runtime

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-blender-runtime.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Download Blender 4.5.10 LTS from an official mirror
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 \
            --user-agent 'Mozilla/5.0' \
            https://mirrors.dotsrc.org/blender/blender-release/Blender4.5/blender-4.5.10-linux-x64.tar.xz \
            --output blender-4.5.10-linux-x64.tar.xz
          test "$(stat -c%s blender-4.5.10-linux-x64.tar.xz)" -gt 300000000
          sha256sum blender-4.5.10-linux-x64.tar.xz | tee blender-4.5.10-linux-x64.tar.xz.sha256

      - name: Upload portable Blender runtime
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.5.10-linux-x64
          path: |
            blender-4.5.10-linux-x64.tar.xz
            blender-4.5.10-linux-x64.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
