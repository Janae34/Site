name: Bootstrap Blender runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-blender-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download Blender 4.5 LTS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 \
            https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz \
            --output blender-4.5.13-linux-x64.tar.xz
          sha256sum blender-4.5.13-linux-x64.tar.xz | tee blender-4.5.13-linux-x64.tar.xz.sha256

      - name: Upload portable Blender runtime
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.5.13-linux-x64
          path: |
            blender-4.5.13-linux-x64.tar.xz
            blender-4.5.13-linux-x64.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
