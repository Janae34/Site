name: Blender download probe

on:
  push:
    branches: [main]
    paths: [.github/workflows/blender-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe Blender archive
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 --retry-delay 2 --head \
            https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz
